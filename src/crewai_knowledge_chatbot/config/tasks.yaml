research_task:
 description: >
  Use the following memories (user and assistant) to assist with answering the user query if relevant


  {memories}


  After, infer what {topic} means in context of the conversation with the memories you've been given.
  Than Research the {topic} using only Sony-relevant history or publicly available, brand-aligned sources to ensure your information is accurate and up to date

 expected_output: >
   A general summary with no sensitive data, ensuring alignment with Sony’s products, services, or content areas
 agent: researcher

reporting_task:
 description: >
   Use the following memories to assist with answering the user query if relevant - {memories}
   If not, summarize research findings in bullet points, focusing on clarity, accuracy, and compliance with Sony's brand and communication standards
 expected_output: >
   Bullet points summarizing the topic.
 agent: reporting_analyst

support_task:
 description: >
   Perform a final review of the summary for compliance and accuracy, 
   ensuring it follows Sony’s privacy and communication guidelines.
 expected_output: >
   Finalized, compliant summary provided by the summarizer agent, ready for external use 
 agent: support_QA_agent
